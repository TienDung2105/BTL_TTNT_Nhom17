<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Image Retrieval</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div>
          <h1>AI Image Retrieval</h1>
          <p class="subtitle">Tải ảnh sản phẩm lên để tìm các ảnh tương tự trong dataset.</p>
        </div>
        <div id="status" class="status" title="Trạng thái API">
          <span class="dot"></span>
          <span id="statusText">Đang kiểm tra</span>
        </div>
      </div>

      <label id="dropzone" class="dropzone">
        <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp">
        <div id="uploadCopy" class="upload-copy">
          <strong>Chọn hoặc kéo ảnh vào đây</strong>
          <span>Hỗ trợ JPG, PNG, WEBP. Ảnh sẽ được gửi tới backend để trích xuất đặc trưng.</span>
        </div>
        <div id="preview" class="preview">
          <img id="previewImage" alt="Ảnh query">
          <span id="fileName" class="message"></span>
        </div>
      </label>

      <div class="controls">
        <div class="field">
          <div class="field-row">
            <label for="topK">Số kết quả</label>
            <span id="topKValue" class="value-pill">10</span>
          </div>
          <input id="topK" type="range" min="1" max="50" value="10">
        </div>

        <div class="field">
          <label for="apiBase">Backend API</label>
          <input id="apiBase" class="api-base" type="url" value="http://127.0.0.1:8000">
        </div>

        <div class="actions">
          <button id="searchBtn" class="btn btn-primary" type="button" disabled>
            <span>Tìm ảnh tương tự</span>
          </button>
          <button id="clearBtn" class="btn btn-secondary" type="button">
            <span>Xóa</span>
          </button>
        </div>

        <div id="message" class="message">Chọn ảnh để bắt đầu.</div>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div>
          <h2>Kết quả tìm kiếm</h2>
          <div id="resultCount" class="count">Chưa có kết quả</div>
        </div>
      </div>

      <section id="results" class="results">
        <div class="empty">Upload một ảnh sản phẩm để xem các ảnh gần giống nhất.</div>
      </section>
    </main>
  </div>

  <script src="javascript.js"></script>
</body>
</html>
