<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Image Retrieval</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-2: #eef3f8;
      --text: #1f2937;
      --muted: #667085;
      --line: #d8e0ea;
      --accent: #1476cc;
      --accent-dark: #0d5ea6;
      --ok: #18794e;
      --warn: #b54708;
      --danger: #b42318;
      --shadow: 0 16px 45px rgba(31, 41, 55, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .brand {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .status {
      min-width: max-content;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      background: #fff;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--warn);
    }

    .status.ready .dot {
      background: var(--ok);
    }

    .status.error .dot {
      background: var(--danger);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .dropzone {
      min-height: 260px;
      display: grid;
      place-items: center;
      padding: 22px;
      border: 1px dashed #9aa9bb;
      border-radius: 8px;
      background: var(--panel-2);
      text-align: center;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .dropzone.dragging {
      border-color: var(--accent);
      background: #e7f2fd;
    }

    .dropzone input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .preview {
      width: 100%;
      display: none;
      gap: 14px;
    }

    .preview.has-image {
      display: grid;
    }

    .preview img {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--line);
    }

    .upload-copy {
      display: grid;
      gap: 9px;
      color: var(--muted);
      line-height: 1.5;
    }

    .upload-copy strong {
      color: var(--text);
      font-size: 17px;
    }

    .controls {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    label {
      color: var(--text);
      font-weight: 650;
      font-size: 14px;
    }

    .value-pill {
      min-width: 44px;
      text-align: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 13px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .api-base {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      color: var(--text);
      background: #fff;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .btn {
      height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      color: #fff;
      background: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-dark);
    }

    .btn-secondary {
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .message.error {
      color: var(--danger);
    }

    .main {
      min-width: 0;
      padding: 28px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 20px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .toolbar h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
    }

    .count {
      color: var(--muted);
      font-size: 14px;
    }

    .results {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
      align-content: start;
    }

    .empty {
      min-height: 420px;
      grid-column: 1 / -1;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      text-align: center;
      padding: 28px;
    }

    .card {
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 8px 26px rgba(31, 41, 55, 0.06);
    }

    .thumb {
      width: 100%;
      aspect-ratio: 1 / 1.12;
      display: block;
      object-fit: cover;
      background: var(--panel-2);
    }

    .card-body {
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
    }

    .name {
      margin: 0;
      min-width: 0;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .rank {
      flex: 0 0 auto;
      padding: 4px 8px;
      border-radius: 999px;
      color: #fff;
      background: var(--accent);
      font-size: 12px;
      font-weight: 800;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      max-width: 100%;
      padding: 4px 7px;
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .score {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .score-bar {
      height: 7px;
      flex: 1;
      border-radius: 999px;
      overflow: hidden;
      background: #e5eaf0;
    }

    .score-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--ok);
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .main {
        padding-top: 22px;
      }
    }

    @media (max-width: 560px) {
      .sidebar,
      .main {
        padding: 18px;
      }

      .brand,
      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      h1 {
        font-size: 24px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .results {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div>
          <h1>AI Image Retrieval</h1>
          <p class="subtitle">Tải ảnh sản phẩm lên để tìm các ảnh tương tự trong dataset.</p>
        </div>
        <div id="status" class="status" title="Trạng thái API">
          <span class="dot"></span>
          <span id="statusText">Đang kiểm tra</span>
        </div>
      </div>

      <label id="dropzone" class="dropzone">
        <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp">
        <div id="uploadCopy" class="upload-copy">
          <strong>Chọn hoặc kéo ảnh vào đây</strong>
          <span>Hỗ trợ JPG, PNG, WEBP. Ảnh sẽ được gửi tới backend để trích xuất đặc trưng.</span>
        </div>
        <div id="preview" class="preview">
          <img id="previewImage" alt="Ảnh query">
          <span id="fileName" class="message"></span>
        </div>
      </label>

      <div class="controls">
        <div class="field">
          <div class="field-row">
            <label for="topK">Số kết quả</label>
            <span id="topKValue" class="value-pill">10</span>
          </div>
          <input id="topK" type="range" min="1" max="50" value="10">
        </div>

        <div class="field">
          <label for="apiBase">Backend API</label>
          <input id="apiBase" class="api-base" type="url" value="http://127.0.0.1:8000">
        </div>

        <div class="actions">
          <button id="searchBtn" class="btn btn-primary" type="button" disabled>
            <span>Tìm ảnh tương tự</span>
          </button>
          <button id="clearBtn" class="btn btn-secondary" type="button">
            <span>Xóa</span>
          </button>
        </div>

        <div id="message" class="message">Chọn ảnh để bắt đầu.</div>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div>
          <h2>Kết quả tìm kiếm</h2>
          <div id="resultCount" class="count">Chưa có kết quả</div>
        </div>
      </div>

      <section id="results" class="results">
        <div class="empty">Upload một ảnh sản phẩm để xem các ảnh gần giống nhất.</div>
      </section>
    </main>
  </div>

  <script>
    const els = {
      apiBase: document.querySelector("#apiBase"),
      clearBtn: document.querySelector("#clearBtn"),
      dropzone: document.querySelector("#dropzone"),
      fileInput: document.querySelector("#fileInput"),
      fileName: document.querySelector("#fileName"),
      message: document.querySelector("#message"),
      preview: document.querySelector("#preview"),
      previewImage: document.querySelector("#previewImage"),
      resultCount: document.querySelector("#resultCount"),
      results: document.querySelector("#results"),
      searchBtn: document.querySelector("#searchBtn"),
      status: document.querySelector("#status"),
      statusText: document.querySelector("#statusText"),
      topK: document.querySelector("#topK"),
      topKValue: document.querySelector("#topKValue"),
      uploadCopy: document.querySelector("#uploadCopy")
    };

    let selectedFile = null;
    let previewUrl = null;

    function apiUrl(path) {
      return `${els.apiBase.value.replace(/\/+$/, "")}${path}`;
    }

    function setMessage(text, isError = false) {
      els.message.textContent = text;
      els.message.classList.toggle("error", isError);
    }

    function setStatus(kind, text) {
      els.status.className = `status ${kind || ""}`.trim();
      els.statusText.textContent = text;
    }

    async function checkHealth() {
      setStatus("", "Đang kiểm tra");

      try {
        const res = await fetch(apiUrl("/api/health"));
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (data.index_ready) {
          setStatus("ready", "Sẵn sàng");
        } else {
          setStatus("error", "Chưa có index");
          setMessage("Backend chạy được nhưng index chưa sẵn sàng. Hãy chạy: python -m backend.build_index", true);
        }
      } catch (error) {
        setStatus("error", "Mất kết nối");
        setMessage("Không kết nối được backend. Hãy chạy uvicorn backend.main:app --reload.", true);
      }
    }

    function setFile(file) {
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        setMessage("File được chọn không phải ảnh.", true);
        return;
      }

      selectedFile = file;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);

      els.previewImage.src = previewUrl;
      els.fileName.textContent = file.name;
      els.preview.classList.add("has-image");
      els.uploadCopy.style.display = "none";
      els.searchBtn.disabled = false;
      setMessage("Ảnh đã sẵn sàng. Bấm tìm để gửi lên backend.");
    }

    function clearAll() {
      selectedFile = null;
      els.fileInput.value = "";
      els.searchBtn.disabled = true;
      els.preview.classList.remove("has-image");
      els.previewImage.removeAttribute("src");
      els.fileName.textContent = "";
      els.uploadCopy.style.display = "grid";
      els.resultCount.textContent = "Chưa có kết quả";
      els.results.innerHTML = '<div class="empty">Upload một ảnh sản phẩm để xem các ảnh gần giống nhất.</div>';
      setMessage("Chọn ảnh để bắt đầu.");

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }
    }

    function fieldValue(item, key) {
      const value = item[key];
      if (!value || value === "nan" || value === "NaN") return "";
      return String(value);
    }

    function renderResults(results) {
      if (!results.length) {
        els.resultCount.textContent = "Không có kết quả";
        els.results.innerHTML = '<div class="empty">Backend không trả về ảnh phù hợp.</div>';
        return;
      }

      els.resultCount.textContent = `${results.length} kết quả`;
      els.results.innerHTML = results.map((item) => {
        const tags = [
          fieldValue(item, "gender"),
          fieldValue(item, "article_type"),
          fieldValue(item, "base_colour"),
          fieldValue(item, "usage")
        ].filter(Boolean);
        const score = Number(item.score || 0);
        const scorePercent = Math.max(0, Math.min(100, score * 100));
        const imageSrc = apiUrl(item.image_url || "");
        const title = fieldValue(item, "name") || `Ảnh ${item.id || item.rank}`;

        return `
          <article class="card">
            <img class="thumb" src="${escapeHtml(imageSrc)}" alt="${escapeHtml(title)}" loading="lazy">
            <div class="card-body">
              <div class="card-top">
                <h3 class="name">${escapeHtml(title)}</h3>
                <span class="rank">#${escapeHtml(String(item.rank || ""))}</span>
              </div>
              <div class="meta">
                ${tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}
              </div>
              <div class="score">
                <span>Score ${score.toFixed(4)}</span>
                <span class="score-bar"><span class="score-fill" style="width:${scorePercent}%"></span></span>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function search() {
      if (!selectedFile) return;

      const formData = new FormData();
      formData.append("file", selectedFile);

      els.searchBtn.disabled = true;
      setMessage("Đang tìm kiếm...");
      els.results.innerHTML = '<div class="empty">Đang xử lý ảnh query...</div>';

      try {
        const res = await fetch(apiUrl(`/api/search?top_k=${els.topK.value}`), {
          method: "POST",
          body: formData
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.detail || `Search lỗi HTTP ${res.status}`);
        }

        renderResults(data.results || []);
        setMessage("Hoàn tất.");
      } catch (error) {
        els.results.innerHTML = '<div class="empty">Không thể hiển thị kết quả.</div>';
        setMessage(error.message || "Có lỗi khi tìm kiếm.", true);
      } finally {
        els.searchBtn.disabled = !selectedFile;
      }
    }

    els.fileInput.addEventListener("change", (event) => {
      setFile(event.target.files[0]);
    });

    els.dropzone.addEventListener("dragover", (event) => {
      event.preventDefault();
      els.dropzone.classList.add("dragging");
    });

    els.dropzone.addEventListener("dragleave", () => {
      els.dropzone.classList.remove("dragging");
    });

    els.dropzone.addEventListener("drop", (event) => {
      event.preventDefault();
      els.dropzone.classList.remove("dragging");
      setFile(event.dataTransfer.files[0]);
    });

    els.topK.addEventListener("input", () => {
      els.topKValue.textContent = els.topK.value;
    });

    els.apiBase.addEventListener("change", checkHealth);
    els.searchBtn.addEventListener("click", search);
    els.clearBtn.addEventListener("click", clearAll);

    checkHealth();
  </script>
</body>
</html>
